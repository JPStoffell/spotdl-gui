name: Build Windows Executable

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build executable
        run: |
          pyinstaller `
            --name=SpotDL `
            --onefile `
            --windowed `
            --add-data "README.txt:." `
            --collect-data=pykakasi `
            spotdl_gui_main.py
      
      - name: Create portable package
        run: |
          mkdir dist/SpotDL_Portable
          copy dist/SpotDL.exe dist/SpotDL_Portable/
          if (Test-Path README.txt) { copy README.txt dist/SpotDL_Portable/ }
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotDL-Windows-Portable
          path: dist/SpotDL_Portable/
          retention-days: 90
