name: Build Windows executable

on:
  push:
    branches: [main]
    paths:
      - "spotdl_ui/**"
      - "windows_main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "spotdl_ui/**"
      - "windows_main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller `
            --name SpotDL-UI `
            --onefile `
            --windowed `
            --collect-data pykakasi `
            --collect-data ytmusicapi `
            --collect-data spotdl `
            --hidden-import spotipy `
            windows_main.py

      - name: Stage portable package
        run: |
          New-Item -ItemType Directory -Path dist/SpotDL-UI-Windows -Force
          Copy-Item dist/SpotDL-UI.exe dist/SpotDL-UI-Windows/
          Copy-Item README.md dist/SpotDL-UI-Windows/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotDL-UI-Windows
          path: dist/SpotDL-UI-Windows/
          retention-days: 90
